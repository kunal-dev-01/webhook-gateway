# ════════════════════════════════════════════════════════
#  PRODUCTION CONFIG — HTTPS + Cloudflare Origin SSL
#  Domain  : api.upnixo.com
#  Services: Auth :8081 | User :8082
#  Usage   : make prod-deploy
# ════════════════════════════════════════════════════════

# ── Upstream Services ─────────────────────────────────
upstream auth_service {
    server    localhost:8081;
    keepalive 32;
}

upstream user_service {
    server    localhost:8082;
    keepalive 32;
}

# ════════════════════════════════════════════════════════
#  HTTP → HTTPS Redirect
# ════════════════════════════════════════════════════════
server {
    listen      80;
    server_name api.upnixo.com;

    # Sabko HTTPS pe bhejo
    return 301 https://$host$request_uri;
}

# ════════════════════════════════════════════════════════
#  HTTPS — Main Server
# ════════════════════════════════════════════════════════
server {
    listen      443 ssl;
    http2       on;
    server_name api.upnixo.com;

    # ── Cloudflare Origin Certificate ────────────────
    ssl_certificate     /etc/nginx/ssl/api.upnixo.com.crt;
    ssl_certificate_key /etc/nginx/ssl/api.upnixo.com.key;

    # ── SSL Hardening ─────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ── Security Headers ──────────────────────────────
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload"  always;
    add_header X-Frame-Options            "DENY"                                           always;
    add_header X-Content-Type-Options     "nosniff"                                        always;
    add_header X-XSS-Protection           "1; mode=block"                                  always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"                always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()"       always;

    # Nginx version hide karo
    server_tokens off;

    # ── Timeouts ──────────────────────────────────────
    proxy_connect_timeout  10s;
    proxy_send_timeout     30s;
    proxy_read_timeout     30s;
    send_timeout           30s;

    # ── Buffer Settings ───────────────────────────────
    proxy_buffering    on;
    proxy_buffer_size  8k;
    proxy_buffers      8 8k;

    # ── Gzip Compression ──────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_types
        text/plain
        application/json
        application/javascript
        text/css
        application/xml;

    # ── Cloudflare Real IP ────────────────────────────
    # Cloudflare ke peeche asli client IP milega
    set_real_ip_from  173.245.48.0/20;
    set_real_ip_from  103.21.244.0/22;
    set_real_ip_from  103.22.200.0/22;
    set_real_ip_from  103.31.4.0/22;
    set_real_ip_from  141.101.64.0/18;
    set_real_ip_from  108.162.192.0/18;
    set_real_ip_from  190.93.240.0/20;
    set_real_ip_from  188.114.96.0/20;
    set_real_ip_from  197.234.240.0/22;
    set_real_ip_from  198.41.128.0/17;
    set_real_ip_from  162.158.0.0/15;
    set_real_ip_from  104.16.0.0/13;
    set_real_ip_from  104.24.0.0/14;
    set_real_ip_from  172.64.0.0/13;
    set_real_ip_from  131.0.72.0/22;
    real_ip_header    CF-Connecting-IP;

    # ════════════════════════════════════════════════
    #  ROUTES
    # ════════════════════════════════════════════════

    # ── Auth Service → :8081 ─────────────────────────
    location /api/v1/auth {
        proxy_pass         http://auth_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;
        proxy_set_header   Connection        "";
    }

    # ── User Service → :8082 ─────────────────────────
    location /api/v1/user {
        proxy_pass         http://user_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;
        proxy_set_header   Connection        "";
    }

    # ── Health Check ──────────────────────────────────
    location /health {
        access_log  off;
        return 200 '{"status":"ok","env":"production"}';
        add_header  Content-Type application/json;
    }

    # ── Block unknown routes ──────────────────────────
    location / {
        return 404 '{"error":"not found"}';
        add_header Content-Type application/json;
    }

    # ── Logs ──────────────────────────────────────────
    access_log  /var/log/nginx/api_upnixo_access.log;
    error_log   /var/log/nginx/api_upnixo_error.log warn;
}