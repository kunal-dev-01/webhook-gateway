# ════════════════════════════════════════════════════════
#  DEV CONFIG — HTTP Only, No SSL
#  Usage: make dev
# ════════════════════════════════════════════════════════

upstream auth_service {
    server localhost:8081;
    keepalive 16;
}

upstream user_service {
    server localhost:8082;
    keepalive 16;
}

upstream billing_service {
    server localhost:8083;
    keepalive 16;
}

upstream webhook_service {
    server localhost:8084;
    keepalive 16;
}

server {
    listen 80;
    server_name localhost;

    # ── Auth Service → :8081 ──────────────────────────
    location /api/v1/auth {
        proxy_pass         http://auth_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── User Service → :8082 ─────────────────────────
    location /api/v1/user {
        proxy_pass         http://user_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Billing Service → :8083 ──────────────────────
    location /api/v1/billing {
        proxy_pass         http://billing_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Webhook Service → :8084 ──────────────────────
    location /api/v1/webhook {
        proxy_pass         http://webhook_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Health Check ──────────────────────────────────
    location /health {
        return 200 '{"status":"ok","env":"dev"}';
        add_header Content-Type application/json;
    }

    # ── 404 Fallback ──────────────────────────────────
    location / {
        return 404 '{"error":"route not found"}';
        add_header Content-Type application/json;
    }
}